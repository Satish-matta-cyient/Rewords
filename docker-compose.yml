services:
  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: edurewards-api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      # The database lives on a named volume, never inside the container layer,
      # so rebuilding the image can never destroy the points ledger.
      DATABASE_URL: "file:/data/edurewards.db"
      UPLOAD_DIR: /uploads
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:4000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?JWT_REFRESH_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      COOKIE_SECURE: "true"
      ENABLE_JOBS: "true"
    volumes:
      - edurewards-db:/data
      - edurewards-uploads:/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: edurewards-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  edurewards-db:
  edurewards-uploads:
